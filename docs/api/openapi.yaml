openapi: 3.1.0
info:
  title: Phichai School Directory API
  version: 0.1.0
  description: Server-only Vercel API for the public student directory and protected import lifecycle.
servers:
  - url: /
paths:
  /api/search:
    get:
      operationId: searchStudents
      security: []
      description: >-
        Returns published students ordered by roster order. Omitting q and every
        filter is a browse request that lists the whole published roster, one page
        at a time.
      parameters:
        - name: q
          in: query
          description: Partial name search; digit-only input matches an approved student-number prefix.
          schema: { type: string, maxLength: 80 }
        - { name: academicYear, in: query, schema: { type: string, maxLength: 20 } }
        - { name: grade, in: query, schema: { type: string, maxLength: 20 } }
        - { name: room, in: query, schema: { type: string, maxLength: 20 } }
        - { name: status, in: query, schema: { type: string, maxLength: 80 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Public student results, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/admin/imports:
    post:
      operationId: uploadStudentWorkbooks
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, academicYear]
              properties:
                file:
                  type: array
                  minItems: 6
                  maxItems: 6
                  items: { type: string, format: binary }
                  description: One approved XLSX workbook for each grade M.1 through M.6
                academicYear: { type: string, pattern: '^\d{4}$' }
                mappingVersion: { type: string, default: student-xlsx-room-sheets-v1 }
                sourceType: { type: string, const: approved_student_xlsx }
      responses:
        '201': { description: Uploaded and validated six-workbook grade set }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: One workbook exceeds 3 MiB or the six-file request exceeds 4 MiB }
  /api/admin/imports/{jobId}:
    get:
      operationId: getImportStatus
      security: [{ bearerAuth: [] }]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Safe import status and validation issues }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/imports/{jobId}/publish:
    post:
      operationId: publishImport
      security: [{ bearerAuth: [] }]
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Published active dataset version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/versions/{versionId}/rollback:
    post:
      operationId: rollbackDataset
      security: [{ bearerAuth: [] }]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Restored prior active dataset version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    PublicStudent:
      type: object
      required: [publicId, recordType, displayName, academicYear, grade, room, publishedAt]
      properties:
        publicId: { type: string }
        recordType: { type: string, const: student }
        displayName: { type: string }
        studentNumber: { type: string, description: Public student number, shown only when approved_field_config authorizes it }
        academicYear: { type: string }
        grade: { type: string }
        room: { type: string }
        status: { type: string }
        publishedAt: { type: string, format: date-time }
    SearchResponse:
      type: object
      required: [items, total, datasetVersion, publishedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicStudent' } }
        total: { type: integer, description: Total published students matching the request, across all pages }
        nextCursor: { type: string }
        datasetVersion: { type: string }
        publishedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Insufficient administrator role, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Lifecycle conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RateLimited: { description: Search rate limit exceeded, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unavailable: { description: Directory unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
